<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>콩닥콩닥 진찰실 · CPX 신체진찰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4F3EC; --paper:#FFFFFF; --ink:#23403A; --muted:#5C786F; --line:#CDE4DA;
  --mint:#8FD3BC; --mint-d:#2F8C71; --coral-d:#E0607A; --sky:#8CC8EA;
  --butter:#FFE59E; --alert:#D24B4B; --alert-bg:#FDECEC; --ok-bg:#E8F7F0; --glow:#FFB84D;
  --shadow:0 3px 0 rgba(35,64,58,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15231F; --paper:#1E312B; --ink:#E3F1EB; --muted:#9BB6AC; --line:#2F4A41;
    --mint-d:#4FB894; --alert:#FF8078; --alert-bg:#3A2224; --ok-bg:#1C3A30; --shadow:0 3px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#15231F; --paper:#1E312B; --ink:#E3F1EB; --muted:#9BB6AC; --line:#2F4A41;
  --mint-d:#4FB894; --alert:#FF8078; --alert-bg:#3A2224; --ok-bg:#1C3A30; --shadow:0 3px 0 rgba(0,0,0,.35);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.55;
  background-image:radial-gradient(circle at 1px 1px, rgba(47,140,113,.12) 1.5px, transparent 0);background-size:22px 22px}
h1,h2,h3,button{font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400}
button{cursor:pointer;border:none;color:inherit;font-size:1rem}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--glow);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:16px}
.screen{display:none}.screen.on{display:block}
.btn{background:var(--mint-d);color:#fff;padding:12px 22px;border-radius:999px;box-shadow:var(--shadow);font-size:1.1rem}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line)}
.btn.coral{background:var(--coral-d)}
.btn.small{padding:7px 13px;font-size:.95rem}
.center{text-align:center}

/* start */
.title-card{text-align:center;padding:14px 8px 4px}
.title-card h1{font-size:clamp(2.2rem,7vw,3.4rem);margin:0;line-height:1.1;color:var(--mint-d)}
.title-card p{color:var(--muted);margin:.4rem 0 0}
.hero-patient{width:130px;max-width:40vw;margin:0 auto;display:block}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 8px;align-items:center}
.seg{display:inline-flex;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:3px}
.seg button{background:none;padding:8px 16px;border-radius:999px;font-size:1rem}
.seg button[aria-pressed="true"]{background:var(--mint-d);color:#fff}
.mode-desc{text-align:center;color:var(--muted);font-size:.9rem;margin:0 auto 10px;max-width:560px}
.sys{margin:18px 0 0}
.sys h3{margin:0 0 8px;font-size:1.15rem;color:var(--mint-d)}
.cases{display:flex;flex-wrap:wrap;gap:8px}
.case-chip{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:1rem;display:flex;flex-direction:column;align-items:flex-start;min-width:110px;box-shadow:var(--shadow)}
.case-chip small{font-family:"Gowun Dodum",sans-serif;font-size:.75rem;color:var(--muted)}
.case-chip:hover{border-color:var(--mint)}
.case-chip.done small{color:var(--mint-d)}

/* case card */
.clip{max-width:540px;margin:20px auto;background:var(--paper);border-radius:18px;border:2px solid var(--line);padding:26px 22px 22px;position:relative;box-shadow:var(--shadow)}
.clip::before{content:"";position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:110px;height:26px;background:var(--sky);border-radius:10px}
.clip h2{margin:0 0 2px;font-size:1.6rem}
.clip .who{color:var(--muted);margin-bottom:12px}
.cc{display:inline-block;background:var(--butter);color:#4A3A10;border-radius:10px;padding:2px 10px;font-family:"Jua",sans-serif}
.story{margin:12px 0;padding:12px 14px;background:var(--bg);border-radius:12px}
.vitals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 18px}
.vitals div{background:var(--bg);border-radius:10px;padding:6px;text-align:center}
.vitals b{display:block;font-family:"Jua",sans-serif;font-size:1.05rem}
.vitals span{font-size:.8rem;color:var(--muted)}
.task{font-size:.95rem;color:var(--muted)}
.sens{font-size:.85rem;color:var(--muted);border-left:3px solid var(--line);padding-left:8px}

/* play */
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-family:"Jua",sans-serif;font-size:.95rem}
.timer{font-family:"Jua",sans-serif;font-size:1.3rem;min-width:64px;text-align:center}
.timer.warn{color:var(--alert)}
.spacer{flex:1}
.play{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.play{grid-template-columns:1fr}}
.stage{background:var(--paper);border:2px solid var(--line);border-radius:24px;position:relative;padding:12px;overflow:hidden}
.curtain{position:absolute;inset:0 0 auto 0;height:18px;background:repeating-linear-gradient(90deg,var(--mint) 0 18px,#A8DDCB 18px 36px);opacity:.8}
svg.patient{display:block;width:100%;max-height:56vh;margin:18px auto 0}
.hint-line{text-align:center;color:var(--muted);min-height:1.6em;font-size:.95rem;padding:0 6px}
.tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.bubble{position:absolute;max-width:64%;border:2px solid #23403A;border-radius:16px;padding:8px 12px;font-size:.93rem;opacity:0;transform:scale(.92);transition:opacity .2s, transform .2s;pointer-events:none;z-index:3;color:#23403A}
.bubble.show{opacity:1;transform:scale(1)}
.bubble.doc{left:12px;bottom:150px;background:#EAF4FB}
.bubble.pt{right:12px;top:30px;background:#FFF1F3}
.bubble .who{font-family:"Jua",sans-serif;font-size:.78rem;display:block;opacity:.7}

.part{cursor:pointer;transition:filter .15s}
.part:hover,.part:focus-visible{filter:drop-shadow(0 0 7px var(--glow)) drop-shadow(0 0 2px var(--glow));outline:none}
.hot{fill:rgba(255,255,255,0);stroke:transparent;stroke-width:3;stroke-dasharray:6 5}
.part:hover .hot,.part:focus-visible .hot{stroke:var(--glow)}

.chart{background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px;max-height:82vh;overflow:auto}
.chart h3{margin:0;font-size:1.2rem}
.chart .sub{color:var(--muted);font-size:.85rem;margin-top:-6px}
.mnemo{background:var(--butter);color:#4A3A10;border-radius:12px;padding:8px 10px;font-size:.88rem}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.log li{border-left:4px solid var(--mint);background:var(--bg);padding:8px 10px;border-radius:0 10px 10px 0;font-size:.93rem}
.log li b{font-family:"Jua",sans-serif;font-weight:400}
.log li.ab{border-left-color:var(--alert);background:var(--alert-bg)}
.log li.extra{border-left-color:var(--muted)}
.log .note{display:block;color:var(--muted);font-size:.84rem;margin-top:2px}
.tag{font-size:.75rem;margin-left:6px;color:var(--muted)}
.empty{color:var(--muted);font-size:.95rem}
.check{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:.84rem}
.check span{color:var(--muted);background:var(--bg);border-radius:8px;padding:1px 7px}
.check span.done{color:var(--mint-d);text-decoration:line-through}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(20,40,35,.35);display:none;z-index:10}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(580px,100%);background:var(--paper);border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:11;transition:transform .22s ease;max-height:82vh;overflow:auto}
.sheet.on{transform:translate(-50%,0)}
.sheet h3{margin:0 0 10px;font-size:1.35rem}
.exam-row{border:2px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.exam-row .nm{font-family:"Jua",sans-serif;font-size:1.02rem;flex:1;min-width:150px}
.exam-row .btns{display:flex;gap:6px}
.exam-row .fd{flex-basis:100%;font-size:.88rem;color:var(--muted)}
.exam-row.done{background:var(--ok-bg)}

/* dx */
.dx-list{display:grid;gap:10px;max-width:560px;margin:16px auto}
.dx-list button{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:14px;font-size:1.08rem;text-align:left;box-shadow:var(--shadow)}
.dx-list button:hover{border-color:var(--mint)}

/* result */
.score-big{font-family:"Jua",sans-serif;font-size:clamp(3.5rem,14vw,6rem);line-height:1;color:var(--mint-d);margin:10px 0 0}
.score-big small{font-size:.35em;color:var(--muted)}
.bars{max-width:560px;margin:18px auto;display:grid;gap:10px}
.bar{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;font-size:.95rem}
.track{height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--mint-d);border-radius:99px;width:0;transition:width .8s ease}
.bar .v{font-family:"Jua",sans-serif;text-align:right}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:16px 18px;max-width:780px;margin:14px auto}
.panel h3{margin:0 0 8px}
.panel p{margin:.35rem 0}
.seq{font-size:.92rem;background:var(--bg);border-radius:12px;padding:8px 10px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:560px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:"Jua",sans-serif;font-weight:400;color:var(--muted)}
td.miss{color:var(--alert)}
tr.abrow td:nth-child(3){color:var(--alert)}
.row-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 30px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

<section id="s-start" class="screen on">
  <div class="title-card">
    <svg class="hero-patient" viewBox="0 0 320 460" aria-hidden="true"><use href="#patient-sym"/></svg>
    <h1>콩닥콩닥 진찰실</h1>
    <p>CPX 필살 암기법 58개 증례 · <span id="scn-count"></span>개 시나리오로 신체진찰 연습</p>
  </div>
  <div class="controls">
    <div class="seg" role="group" aria-label="모드">
      <button data-mode="learn" aria-pressed="true">📘 학습 모드</button>
      <button data-mode="exam" aria-pressed="false">⏱️ 시험 모드</button>
    </div>
    <button class="btn small" id="random">🎲 랜덤 증례</button>
  </div>
  <p class="mode-desc" id="mode-desc"></p>
  <div id="case-groups"></div>
</section>

<section id="s-case" class="screen">
  <div class="clip">
    <h2 id="c-name"></h2>
    <div class="who" id="c-who"></div>
    <div>주호소 <span class="cc" id="c-cc"></span></div>
    <div class="story" id="c-story"></div>
    <div class="vitals" id="c-vitals"></div>
    <p class="task" id="c-task"></p>
    <p class="sens" id="c-sens" hidden>민감한 주제를 다루는 증례예요. 환자 반응은 차분하게 나와요.</p>
    <div class="row-btns" style="margin:12px 0 0">
      <button class="btn ghost" id="back-list">목록으로</button>
      <button class="btn" id="go-play">진찰 시작</button>
    </div>
  </div>
</section>

<section id="s-play" class="screen">
  <div class="topbar">
    <span class="chip" id="p-mode"></span>
    <span class="chip" id="p-case"></span>
    <span class="spacer"></span>
    <span class="timer" id="p-timer">0:00</span>
    <button class="btn coral small" id="finish">진찰 끝내기</button>
  </div>
  <div class="play">
    <div class="stage">
      <div class="curtain"></div>
      <div class="bubble doc" id="b-doc"><span class="who">나 (의사)</span><span class="tx"></span></div>
      <div class="bubble pt" id="b-pt"><span class="who" id="b-pt-name">환자</span><span class="tx"></span></div>
      <svg class="patient" id="patient" viewBox="0 0 320 460" role="group" aria-label="환자. 진찰할 부위를 누르세요"></svg>
      <div class="hint-line" id="hint-line">진찰할 부위를 눌러 보세요</div>
      <div class="tools">
        <button class="btn ghost small" id="wash">🧼 손 위생</button>
        <button class="btn ghost small" data-region="meas">📏 측정·전신</button>
        <button class="btn ghost small" data-region="back">🔙 등</button>
        <button class="btn ghost small" data-region="skin">🩹 피부</button>
        <button class="btn ghost small" data-region="pelvic">🩺 골반·항문</button>
        <button class="btn ghost small" id="hint">💡 힌트</button>
      </div>
    </div>
    <aside class="chart">
      <h3>진찰 기록</h3>
      <div class="sub" id="chart-sub"></div>
      <div id="mnemo-box"></div>
      <div id="checklist-box"></div>
      <ul class="log" id="log"></ul>
    </aside>
  </div>
</section>

<section id="s-dx" class="screen">
  <div class="center" style="padding-top:20px">
    <h2 style="font-size:1.7rem;margin:0" id="dx-q"></h2>
    <p style="color:var(--muted);margin:.3rem 0 0" id="dx-sub"></p>
  </div>
  <div class="dx-list" id="dx-list"></div>
</section>

<section id="s-result" class="screen">
  <div class="center" style="padding-top:14px">
    <div class="score-big" id="r-score"></div>
    <p id="r-msg" style="font-size:1.1rem;margin:.4rem 0 0"></p>
  </div>
  <div class="bars" id="r-bars"></div>
  <div class="panel" id="r-dx"></div>
  <div class="panel" id="r-order"></div>
  <div class="panel" id="r-table-panel"><h3>항목별 소견과 해설</h3><div class="tbl-wrap"><table id="r-table"></table></div></div>
  <div class="row-btns">
    <button class="btn" id="again">같은 증례 다른 환자</button>
    <button class="btn ghost" id="next-rand">🎲 다른 증례</button>
    <button class="btn ghost" id="home">목록으로</button>
  </div>
</section>
</div>

<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <h3 id="sheet-title"></h3>
  <div id="sheet-body"></div>
  <div class="center"><button class="btn ghost small" id="sheet-close">닫기</button></div>
</div>

<svg width="0" height="0" style="position:absolute"><symbol id="patient-sym" viewBox="0 0 320 460"></symbol></svg>

<script>
/* ================= 진찰 항목 ================= */
const REGION_NAMES={meas:'측정·전신',head:'머리',eyes:'눈',ears:'귀',nose:'코',mouth:'입',neck:'목',chest:'가슴',back:'등',belly:'배',arms:'팔',hand:'손',legs:'다리',skin:'피부',pelvic:'골반·항문'};
// [id, 이름, 부위, 설명 멘트, 환자 반응, 표정, 정상 소견, 해설]
const ITEM_ROWS=[
['vs','활력징후 확인','meas','혈압, 맥박, 호흡, 체온을 다시 확인할게요.','네~','normal','',"모든 증례의 첫 진찰. 이상 V/S는 소리 내어 언급해요."],
['anthro','키·몸무게·허리둘레','meas','키와 몸무게, 허리둘레를 재볼게요.','두근두근…','normal','BMI 22, 허리둘레 정상','비만·대사증후군 평가에 필요해요.'],
['general','전신상태 관찰','meas','전체적인 상태를 먼저 살펴볼게요.','네.','normal','급성 병색 없음, 의식 명료','통증 행동, 자세, 병색을 먼저 봐요.'],
['consc','의식·지남력 (T/P/P)','meas','지금이 낮인가요, 밤인가요? 여기가 어디죠? 성함이 어떻게 되세요?','음… 병원이요!','normal','시간·장소·사람 지남력 정상','의식 수준을 평가해요.'],
['vatga','VATGA + 혈당 확인','meas','기도, 호흡, 맥박을 보고 외상과 의식 정도를 평가할게요. 혈당도 확인할게요.','…','closed','기도 개방, 자발호흡, 외상 없음, GCS 15, 혈당 정상','의식장애는 병력청취 전에 VATGA와 혈당부터!'],
['mmse','MMSE-K','meas','간단한 기억력 검사를 해볼게요. 최종 학력이 어떻게 되세요?','열심히 해볼게요!','normal','MMSE-K 29점','학력 보정을 위해 최종 학력을 꼭 물어요.'],
['gait','보행 검사','meas','일어서서 편하게 걸어보세요. 넘어지지 않게 옆에서 잡아드릴게요.','뚜벅뚜벅','normal','정상 보행, 팔 흔들기 정상','파킨슨·소뇌·수두증을 걸러내요.'],
['romberg','Romberg 검사','meas','발을 모으고 서서 눈을 감아보세요. 옆에서 잡아드릴게요.','흔들흔들…','closed','Romberg 음성','고유감각과 소뇌 기능을 봐요.'],
['tremor','떨림 관찰','meas','손을 무릎에 편히 두고, 이번엔 팔을 앞으로 나란히 해보세요.','이렇게요?','normal','안정 시·자세 시·운동 시 떨림 없음','안정/자세/의도 떨림을 구분해요.'],
['trauma','머리 외상 확인','head','머리에 다친 곳이 있는지 보고 만져볼게요.','다친 데는 없어요~','normal','두피·안면 외상 흔적 없음','두부 외상은 중추성 원인의 단서예요.'],

 closed:'<path d="M151 155 L169 155" stroke="#3A2A24" stroke-width="3.5" stroke-linecap="round"/>',
 ahh:'<ellipse cx="160" cy="157" rx="12" ry="11" fill="#C95A6B"/><ellipse cx="160" cy="162" rx="7" ry="4" fill="#FF8FA0"/>',
};

/* ================= 유틸 ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getBest(m,id){try{return +localStorage.getItem(`kongdak2-${m}-${id}`)||0}catch(e){return 0}}
function setBest(m,id,v){try{localStorage.setItem(`kongdak2-${m}-${id}`,String(v))}catch(e){}}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}
function lcs(a,b){const d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);return d[a.length][b.length]}

/* ================= 상태 ================= */
let MODE='learn', S=null;
const MODE_DESC={learn:'진찰 순서 암기법, 남은 체크리스트, 힌트, 소견별 해설이 보여요. 시간 제한은 없어요.',exam:'5분 안에 알아서 진찰하세요. 체크리스트와 해설은 끝난 뒤에 공개돼요.'};

function renderStart(){
  $('#scn-count').textContent=CASES.reduce((n,c)=>n+c.v.length,0);
  const sym=$('#patient-sym');
  sym.innerHTML=PATIENT_SVG.replace(/ class="part"[^>]*>/g,'>').replace(/<[^>]*class="hot"[^>]*\/>/g,'')
    .replace('<g id="face-eyes"></g>','<g>'+EYES.sick+'</g>').replace('<g id="face-mouth"></g>','<g>'+MOUTH.sick+'</g>').replace(/ id="[^"]*"/g,'');
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===MODE)));
  $('#mode-desc').textContent=MODE_DESC[MODE];
  $('#case-groups').innerHTML=SYS_ORDER.map(sys=>{
    const cs=CASES.filter(c=>c.sys===sys);
    return `<div class="sys"><h3>${sys}</h3><div class="cases">`+cs.map(c=>{
      const b=getBest(MODE,c.id);
      return `<button class="case-chip ${b?'done':''}" data-case="${c.id}">${esc(c.t)}<small>시나리오 ${c.v.length}개 · ${b?`최고 ${b}점`:'도전 전'}</small></button>`;
    }).join('')+'</div></div>';
  }).join('');
  document.querySelectorAll('.case-chip').forEach(b=>b.addEventListener('click',()=>openCase(b.dataset.case)));
  show('s-start');
}

function openCase(id){
  const c=CASES.find(x=>x.id===id);
  let sc,k=0;do{sc=c.v[Math.floor(Math.random()*c.v.length)];k++}while(c.v.length>1&&S&&S.c===c&&S.sc===sc&&k<10);
  const name=NAMES[Math.floor(Math.random()*NAMES.length)];
  S={mode:MODE,c,sc,name,req:c.req?c.req.split(' ').filter(Boolean):[],done:{},seq:[],hand:false,handFirst:false,start:0,timer:null,limit:MODE==='exam'?300:0,over:false};
  $('#c-name').textContent=`${name} 님`;
  $('#c-who').textContent=`${sc.age}${typeof sc.age==='number'?'세':''} ${sc.sex}${typeof sc.age==='number'?'자':'아'}`;
  $('#c-cc').textContent=c.t;
  $('#c-story').textContent=`"${sc.story}"`;
  const vb=$('#c-vitals');
  if(sc.vit==='-'){vb.style.display='none'}else{
    vb.style.display='';const v=sc.vit.split(','),lbl=['혈압','맥박','호흡','체온'];
    vb.innerHTML=v.map((x,i)=>`<div><b>${x}</b><span>${lbl[i]}</span></div>`).join('');
  }
  $('#c-task').textContent='문진은 끝났어요. 이 환자에게 필요한 신체진찰을 암기법 순서대로 하고, 마지막 질문에 답해 주세요. 진찰 전 설명과 손 위생도 점수에 들어가요.';
  $('#c-sens').hidden=!c.serious;
  show('s-case');
}
function vitalsText(){const v=S.sc.vit.split(',');return `BP ${v[0]} mmHg, HR ${v[1]}회/분, RR ${v[2]}회/분, BT ${v[3]}℃`}
function finding(id){
  const ab=(S.sc.ab||{})[id];
  if(ab)return{t:ab[0],ab:true,note:ab[1]||ITEMS[id].note,react:ab[2],expr:ab[3]};
  if(id==='vs')return{t:vitalsText(),ab:false,note:ITEMS.vs.note};
  return{t:ITEMS[id].normal,ab:false,note:ITEMS[id].note};
}

function startPlay(){
  const svg=$('#patient');svg.innerHTML=PATIENT_SVG;
  S.baseFace=(S.c.serious||S.c.gentle||S.c.noPE)?'normal':'sick';
  setFace(S.baseFace);
  svg.querySelectorAll('.part').forEach(p=>{
    const r=p.dataset.region;
    p.addEventListener('click',()=>openSheet(r));
    p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openSheet(r)}});
    p.addEventListener('mouseenter',()=>$('#hint-line').textContent=`${REGION_NAMES[r]} 진찰 목록 보기`);
    p.addEventListener('mouseleave',()=>$('#hint-line').textContent='진찰할 부위를 눌러 보세요');
  });
  $('#p-mode').textContent=S.mode==='learn'?'📘 학습':'⏱️ 시험';
  $('#p-case').textContent=`${S.name} · ${S.c.t}`;
  $('#b-pt-name').textContent=S.name;
  $('#hint').style.display=S.mode==='learn'?'':'none';
  $('#chart-sub').textContent=S.mode==='learn'?'진찰한 순서대로 소견과 해설이 기록돼요':'진찰한 순서대로 소견이 기록돼요';
  $('#mnemo-box').innerHTML=S.mode==='learn'?`<div class="mnemo"><b>암기법</b> ${esc(S.c.mn)}</div>`:'';
  $('#log').innerHTML='<li class="empty" style="border:none;background:none">아직 기록이 없어요</li>';
  $('#wash').disabled=false;$('#wash').textContent='🧼 손 위생';
  $('#finish').textContent='진찰 끝내기';delete $('#finish').dataset.sure;
  renderChecklist();
  S.start=Date.now();clearInterval(S.timer);S.timer=setInterval(tick,250);tick();
  show('s-play');
  say('pt',S.c.serious?'…안녕하세요.':(S.baseFace==='sick'?'으… 잘 부탁드려요…':'안녕하세요, 잘 부탁드려요.'));
}
function tick(){
  const el=(Date.now()-S.start)/1000,t=S.limit?Math.max(0,S.limit-el):el;
  $('#p-timer').textContent=`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
  $('#p-timer').classList.toggle('warn',!!S.limit&&t<=60);
  if(S.limit&&t<=0&&!S.over){closeSheet();say('pt','(시간 종료! 진찰을 마칩니다)');S.over=true;setTimeout(goDx,900)}
}
function setFace(expr){
  const svg=$('#patient');
  svg.querySelector('#face-eyes').innerHTML=EYES[expr];
  svg.querySelector('#face-mouth').innerHTML=MOUTH[expr];
  svg.querySelector('#sweat').style.display=(expr==='sick'||expr==='ouch'||expr==='strain')?'':'none';
}
const bubbleT={};
function say(who,text){
  const b=who==='doc'?$('#b-doc'):$('#b-pt');
  b.querySelector('.tx').textContent=text;b.classList.add('show');
  clearTimeout(bubbleT[who]);bubbleT[who]=setTimeout(()=>b.classList.remove('show'),3400);
}
let faceT=null;
function react(text,expr){say('pt',text);setFace(expr);clearTimeout(faceT);faceT=setTimeout(()=>setFace(S.baseFace),2300)}

function openSheet(region){
  if(!S||S.over)return;
  $('#sheet-title').textContent=`${REGION_NAMES[region]} 진찰`;
  const items=Object.values(ITEMS).filter(i=>i.regions.includes(region));
  $('#sheet-body').innerHTML=items.map(i=>{
    if(S.done[i.id]){const f=finding(i.id);return `<div class="exam-row done"><div class="nm">✓ ${esc(i.name)}</div><div class="fd">${esc(f.t)}</div></div>`}
    return `<div class="exam-row"><div class="nm">${esc(i.name)}</div><div class="btns">
      <button class="btn small" data-do="${i.id}" data-ex="1">🗣️ 설명하고</button>
      <button class="btn ghost small" data-do="${i.id}" data-ex="0">바로</button></div></div>`;
  }).join('');
  $('#sheet-body').querySelectorAll('[data-do]').forEach(b=>b.addEventListener('click',()=>{closeSheet();doExam(b.dataset.do,b.dataset.ex==='1')}));
  $('#sheet-bg').classList.add('on');$('#sheet').classList.add('on');
  ($('#sheet-body button')||$('#sheet-close')).focus();
}
function closeSheet(){$('#sheet-bg').classList.remove('on');$('#sheet').classList.remove('on')}

function doExam(id,explained){
  if(S.done[id]||S.over)return;
  const it=ITEMS[id],f=finding(id),required=S.req.includes(id);
  S.done[id]={explained,at:S.seq.length,required};S.seq.push(id);
  const calm=S.c.serious||S.c.gentle;
  let rtext=f.react||(calm?'네.':it.react),rexpr=f.expr||(calm?'normal':it.expr);
  if(explained){say('doc',it.say);setTimeout(()=>react(rtext,rexpr),450)}
  else{say('doc',`(말없이 ${it.name})`);setTimeout(()=>react(calm?'…!':'앗, 깜짝이야! 뭐 하시는 거예요?','surprised'),400)}
  addLog(it,f,explained,required);renderChecklist();
}
function addLog(it,f,explained,required){
  const log=$('#log'),e=log.querySelector('.empty');if(e)e.remove();
  const learn=S.mode==='learn',li=document.createElement('li');
  li.className=learn?(f.ab?'ab':(!required?'extra':'')):'';
  const tags=(explained?'':'<span class="tag">설명 없이</span>')+(learn&&!required?'<span class="tag">이 증례 필수 항목 아님</span>':'');
  li.innerHTML=`<b>${S.seq.length}. ${esc(it.name)}</b>${tags}<br>${esc(f.t)}${learn?`<span class="note">${f.ab?'⚠️ ':''}${esc(f.note)}</span>`:''}`;
  log.prepend(li);
}
function renderChecklist(){
  const box=$('#checklist-box');
  if(S.mode!=='learn'){box.innerHTML='';return}
  if(S.c.noPE){box.innerHTML='<div class="empty">이 증례는 신체진찰이 없어요. 바로 "진찰 끝내기"를 눌러도 돼요.</div>';return}
  const cnt=S.req.filter(id=>S.done[id]).length;
  box.innerHTML=`<div style="font-size:.9rem;margin-bottom:4px">필수 진찰 ${cnt}/${S.req.length} · 손 위생 ${S.hand?'✓':'아직'}</div><div class="check">`+
    S.req.map(id=>`<span class="${S.done[id]?'done':''}">${esc(ITEMS[id].name)}</span>`).join('')+'</div>';
}
function wash(){
  if(!S||S.hand||S.over)return;
  S.hand=true;S.handFirst=S.seq.length===0;
  $('#wash').disabled=true;$('#wash').textContent='🧼 손 위생 완료';
  say('doc','(손을 깨끗이 소독했어요) 지금부터 진찰을 시작하겠습니다.');
  setTimeout(()=>react('네.','normal'),450);
  if(S.mode==='learn'){
    const log=$('#log'),e=log.querySelector('.empty');if(e)e.remove();
    const li=document.createElement('li');
    li.innerHTML=`<b>손 위생</b>${S.handFirst?'':'<span class="tag">순서 늦음</span>'}<span class="note">${S.handFirst?'좋아요. 환자 접촉 전 손 위생은 CPX 기본 채점 항목이에요.':'손 위생은 환자를 만지기 전에 먼저 해야 해요.'}</span>`;
    log.prepend(li);
  }
  renderChecklist();
}
function hint(){
  if(S.c.noPE){$('#hint-line').textContent='💡 이 증례는 신체진찰이 없어요!';return}
  if(!S.hand){$('#hint-line').textContent='💡 환자를 만지기 전에 손 위생부터!';return}
  const next=S.req.find(id=>!S.done[id]);
  if(!next){$('#hint-line').textContent='💡 필수 진찰을 모두 마쳤어요. "진찰 끝내기"를 눌러 보세요!';return}
  const it=ITEMS[next];
  $('#hint-line').textContent=`💡 다음은 ${REGION_NAMES[it.regions[0]]} → ${it.name}`;
}

function goDx(){
  clearInterval(S.timer);S.over=true;closeSheet();
  S.elapsed=Math.round((Date.now()-S.start)/1000);
  $('#dx-q').textContent=S.c.q||'가장 가능성 높은 진단은?';
  $('#dx-sub').textContent=`${S.name} 님 · ${S.c.t}`;
  const answer=S.sc.dx||S.c.dx;
  const opts=shuffle([answer,...shuffle(S.c.pool.filter(o=>o!==answer)).slice(0,4)]);
  $('#dx-list').innerHTML=opts.map((d,i)=>`<button data-i="${i}">${esc(d)}</button>`).join('');
  $('#dx-list').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>result(opts[+b.dataset.i])));
  show('s-dx');
}
function result(pick){
  const c=S.c,sc=S.sc,answer=sc.dx||c.dx,sum=sc.sum||c.sum;
  const performed=S.seq,extras=performed.filter(id=>!S.req.includes(id)),reqDone=performed.filter(id=>S.req.includes(id));
  let itemsPts,orderPts,expPts,handPts;
  if(c.noPE){
    itemsPts=Math.max(0,50-performed.length*10);orderPts=performed.length?0:10;expPts=15;handPts=5;
  }else{
    itemsPts=Math.round(reqDone.length/S.req.length*50);
    orderPts=reqDone.length>=2?Math.round(lcs(reqDone,S.req)/reqDone.length*10):0;
    expPts=performed.length?Math.round(performed.filter(id=>S.done[id].explained).length/performed.length*15):0;
    handPts=S.hand&&S.handFirst?5:(S.hand?2:0);
  }
  const extraPen=c.noPE?0:Math.min(10,extras.length*2);
  const dxOk=pick===answer,dxPts=dxOk?20:0;
  const total=Math.max(0,itemsPts+orderPts+expPts+handPts+dxPts-extraPen);
  const prev=getBest(S.mode,c.id);if(total>prev)setBest(S.mode,c.id,total);

  $('#r-score').innerHTML=`${total}<small> / 100</small>`;
  $('#r-msg').textContent=(total>=90?'완벽해요! 이 증례는 마스터 🎉':total>=75?'잘했어요! 빠진 부분만 챙기면 돼요.':total>=50?'절반은 넘었어요. 순서를 다시 훑어봐요.':'아직 연습이 필요해요. 학습 모드로 한 번 더!')+(prev&&total>prev?' 최고 기록 갱신!':'');
  const bars=[['진찰 항목',itemsPts,50],['진찰 순서',orderPts,10],['환자 설명',expPts,15],['손 위생',handPts,5],['판단',dxPts,20]];
  $('#r-bars').innerHTML=bars.map(([n,p,m])=>`<div class="bar"><span>${n}</span><div class="track"><div class="fill" data-w="${p/m*100}"></div></div><span class="v">${p}/${m}</span></div>`).join('')+
    (extraPen?`<div class="bar"><span>불필요한 진찰</span><div></div><span class="v" style="color:var(--alert)">−${extraPen}</span></div>`:'')+
    `<div style="text-align:center;color:var(--muted);font-size:.9rem">소요 시간 ${Math.floor(S.elapsed/60)}분 ${S.elapsed%60}초</div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.w+'%')));

  $('#r-dx').innerHTML=`<h3>${dxOk?'✅ 정답':'❌ 오답'}</h3><p>정답: <b>${esc(answer)}</b>${dxOk?'':`<br>내가 고른 답: ${esc(pick)}`}</p><p style="color:var(--muted)">${esc(sum)}</p>`;

  const notes=[];
  notes.push(`<p><b>암기법</b></p><div class="seq">${esc(c.mn)}</div>`);
  if(!c.noPE){
    notes.push(`<p><b>이 증례의 진찰 순서</b></p><div class="seq">${S.req.map(id=>esc(ITEMS[id].name)).join(' → ')}</div>`);
    notes.push(`<p><b>내가 한 순서</b></p><div class="seq">${performed.length?performed.map(id=>esc(ITEMS[id].name)+(S.req.includes(id)?'':' (불필요)')).join(' → '):'진찰하지 않았어요'}</div>`);
    if(!S.hand)notes.push('<p>손 위생을 하지 않았어요. 환자 접촉 전 손 위생은 기본 채점 항목이에요.</p>');
    else if(!S.handFirst)notes.push('<p>손 위생을 했지만 이미 환자를 진찰한 뒤였어요.</p>');
    const noExp=performed.filter(id=>!S.done[id].explained);
    if(noExp.length)notes.push(`<p>설명 없이 진찰한 항목: ${noExp.map(i=>esc(ITEMS[i].name)).join(', ')}</p>`);
    if(extras.length)notes.push(`<p>이 증례 암기법에 없는 진찰: ${extras.map(i=>esc(ITEMS[i].name)).join(', ')}. 실제 시험에서는 시간을 잡아먹어요.</p>`);
  }else{
    notes.push(performed.length?`<p>이 증례는 신체진찰이 없어요. 진찰 ${performed.length}개를 해서 감점됐어요.</p>`:'<p>신체진찰 없이 바로 넘어갔어요. 👍</p>');
  }
  $('#r-order').innerHTML='<h3>순서와 태도</h3>'+notes.join('');

  if(c.noPE){$('#r-table-panel').style.display='none'}else{
    $('#r-table-panel').style.display='';
    $('#r-table').innerHTML='<tr><th>항목</th><th>수행</th><th>소견</th><th>해설</th></tr>'+S.req.map(id=>{
      const f=finding(id),d=S.done[id];
      return `<tr class="${f.ab?'abrow':''}"><td>${esc(ITEMS[id].name)}</td><td class="${d?'':'miss'}">${d?(d.explained?'✓':'✓ (설명 없음)'):'놓침'}</td><td>${f.ab?'⚠️ ':''}${esc(f.t)}</td><td style="color:var(--muted)">${esc(f.note)}</td></tr>`;
    }).join('');
  }
  show('s-result');
}

/* ================= 이벤트 ================= */
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{MODE=b.dataset.mode;renderStart()}));
$('#random').addEventListener('click',()=>openCase(CASES[Math.floor(Math.random()*CASES.length)].id));
$('#back-list').addEventListener('click',renderStart);
$('#go-play').addEventListener('click',startPlay);
document.querySelectorAll('.tools [data-region]').forEach(b=>b.addEventListener('click',()=>openSheet(b.dataset.region)));
$('#sheet-bg').addEventListener('click',closeSheet);
$('#sheet-close').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
$('#wash').addEventListener('click',wash);
$('#hint').addEventListener('click',hint);
$('#finish').addEventListener('click',()=>{
  const b=$('#finish'),left=S.req.filter(id=>!S.done[id]).length;
  if(S.mode==='learn'&&left&&!b.dataset.sure){b.dataset.sure='1';b.textContent=`${left}개 남음, 정말 끝내기`;setTimeout(()=>{delete b.dataset.sure;b.textContent='진찰 끝내기'},3000);return}
  goDx();
});
$('#again').addEventListener('click',()=>{MODE=S.mode;openCase(S.c.id)});
$('#next-rand').addEventListener('click',()=>{MODE=S.mode;let c;do{c=CASES[Math.floor(Math.random()*CASES.length)]}while(c.id===S.c.id);openCase(c.id)});
$('#home').addEventListener('click',()=>{MODE=S.mode;renderStart()});
renderStart();
</script>
</body>
</html>
